{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rewind</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/music_player.css' %}">

    <link rel="stylesheet" href="{% static 'css/music_player_mobile.css' %}" media="screen and (max-width: 800px)">

</head>


<body>

    <main class="music-page" id="musicPage" data-playlist-id="{{ playlist_id }}">

        <div class="background-layer" id="backgroundLayer"></div>


        <div class="background-overlay"></div>


        <header class="music-header">

            <a href="/" class="back-button">
                ←
            </a>

            <div class="brand">
                REWIND
            </div>

        </header>


        <section class="music-content">

            <div class="playlist-visual" id="playlistVisual"></div>


            <div class="playlist-details">

                <div class="playlist-label" id="playlistLabel">
                    PLAYLIST
                </div>


                <div class="playlist-title-row">

                    <h1 id="playlistTitle">
                        Loading...
                    </h1>

                    <button type="button" id="shuffleBtn" class="playlist-shuffle-btn" aria-label="Shuffle playlist"
                        aria-pressed="false" title="Shuffle">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 7h3.5c2.8 0 4.1 1.2 5.5 3
                   l3.5 5c1 1.4 2.2 2 4.5 2h1" />
                            <path d="M17 14l4 3-4 3" />
                            <path d="M3 17h3.5c2.8 0 4.1-1.2 5.5-3
                   l3.5-5c1-1.4 2.2-2 4.5-2h1" />
                            <path d="M17 4l4 3-4 3" />
                        </svg>
                    </button>

                </div>


                <p id="playlistSubtitle" class="playlist-subtitle"></p>


                <div id="songList" class="song-list">

                    <div class="loading">
                        Loading songs...
                    </div>

                </div>

            </div>

        </section>
        <!-- =========================================================
     MUSIC PLAYER
========================================================= -->

        <section class="player" id="player">

            <div class="player-art">

                <div id="playerCover">
                    ♪
                </div>

            </div>


            <div class="now-playing">

                <strong id="playerTitle">
                    Select a song
                </strong>

                <small id="playerArtist">
                    Unknown Artist
                </small>

            </div>


            <div class="controls">

                <button class="control-btn" id="previousBtn" type="button" aria-label="Previous song">
                    ↤
                </button>


                <button class="play-btn" id="playBtn" type="button" aria-label="Play">

                    <span id="playIcon">
                        ▶
                    </span>

                </button>


                <button class="control-btn" id="nextBtn" type="button" aria-label="Next song">
                    ↦
                </button>

            </div>


            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>


                <div class="progress-container" id="progressContainer">

                    <div class="progress">

                        <div id="progressFill"></div>


                        <div id="progressDot"></div>

                    </div>

                </div>


                <span id="totalTime">
                    0:00
                </span>

            </div>


            <div class="volume">

                <button id="volumeBtn" type="button" aria-label="Mute">
                    ♫
                </button>


                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">

            </div>


            <button class="queue-btn" id="queueBtn" type="button" aria-label="Queue">
                ☷
            </button>

        </section>
        <!-- =========================================================
     QUEUE
========================================================= -->

        <aside class="queue" id="queue" aria-hidden="true">

            <div class="queue-title">

                <strong>
                    PLAYING QUEUE
                </strong>

                <button id="closeQueue" type="button" aria-label="Close queue">
                    ×
                </button>

            </div>


            <div id="queueItems" class="queue-items"></div>

        </aside>

        <audio id="audio" preload="auto"></audio>
    </main>


    <script src="{% static 'js/music_player.js' %}"></script>

</body>

</html>
